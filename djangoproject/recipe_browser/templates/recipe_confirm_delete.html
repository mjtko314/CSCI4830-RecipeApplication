{% extends "base.html" %}

{% block content %}
<div class="container my-4" style="max-width: 640px;">
  <h1 class="mb-4">Are you sure you want to delete {{object.title}}</h1>

  <form method="post" novalidate>
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger">Delete</button>
    <a href="{% url 'recipes-view' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
