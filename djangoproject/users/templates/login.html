{% extends "base.html" %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
<style>
  .form-signin input[type="text"] {
    margin-bottom: 4px;
    border-bottom-right-radius: 0;
    border-bottom-left-radius: 0;
  }
</style>
</head>
<body class="text-center">
<form class="form-signin" method="POST">
  <h1 class="h3 mb-3 font-weight-normal">Recipe Browser</h1>
  {% csrf_token %}

  {% if form.errors %}
    <div class="alert alert-danger">Incorrect username or password.</div>
  {% endif %}

  <input name="username" id="inputUsername" class="form-control" placeholder="Username" required autofocus type="text">
  <input name="password" id="inputPassword" class="form-control" placeholder="Password" required type="password">

  <button class="btn btn-lg btn-primary btn-block mt-3" type="submit">Sign in</button>
  <p class="mt-3"><a href="{% url 'user-register' %}">Create an account</a></p>
</form>
</body>
</html>
{% endblock %}

<style>
  .form-signin .form-control {
  width: 20px;
  margin-left: auto;
  margin-right: auto;
}
</style>
